name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - uses: actions/upload-artifact@v6
        with:
          name: mantice-${{ runner.os }}
          path: target/release/mantice.exe

      # The Windows installer is built on every run: it proves that installer/mantice.iss still compiles,
      # and the setup program can be downloaded from the artifacts of the run to try it.
      - name: Build the Windows installer
        shell: pwsh
        run: |
          ./installer/install-inno-setup.ps1
          ./installer/build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: mantice-Windows-setup
          path: installer/Output/*-setup.exe
